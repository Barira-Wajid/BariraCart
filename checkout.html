<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Checkout | BariraCart</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    min-height:100vh;
    color:#f8fafc;
    background:
        radial-gradient(circle at 10% 10%,rgba(139,92,246,.18),transparent 30%),
        radial-gradient(circle at 90% 90%,rgba(6,182,212,.12),transparent 30%),
        #070a12;
}

/* NAVBAR */

header{
    position:sticky;
    top:0;
    z-index:100;
    padding:20px 7%;
    border-bottom:1px solid rgba(255,255,255,.08);
    background:rgba(7,10,18,.8);
    backdrop-filter:blur(18px);
}

.nav{
    max-width:1200px;
    margin:auto;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    font-size:25px;
    font-weight:900;
    letter-spacing:.5px;
}

.logo span{
    color:#a855f7;
}

.secure{
    color:#94a3b8;
    font-size:13px;
}

/* MAIN */

main{
    max-width:1200px;
    margin:auto;
    padding:55px 7%;
}

.back{
    display:inline-block;
    margin-bottom:22px;
    color:#94a3b8;
    text-decoration:none;
    font-size:14px;
    transition:.3s;
}

.back:hover{
    color:#c084fc;
    transform:translateX(-5px);
}

.heading{
    margin-bottom:35px;
}

.heading h1{
    font-size:clamp(35px,5vw,55px);
    line-height:1.05;
    margin-bottom:12px;
}

.heading p{
    color:#94a3b8;
}

/* GRID */

.checkout-grid{
    display:grid;
    grid-template-columns:1.35fr .85fr;
    gap:28px;
    align-items:start;
}

.card{
    background:rgba(15,19,32,.86);
    border:1px solid rgba(255,255,255,.08);
    border-radius:24px;
    padding:30px;
    box-shadow:0 25px 80px rgba(0,0,0,.35);
    backdrop-filter:blur(15px);
}

.card-title{
    font-size:21px;
    font-weight:700;
    margin-bottom:25px;
}

/* FORM */

.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:18px;
}

.field{
    display:flex;
    flex-direction:column;
    gap:8px;
}

.field.full{
    grid-column:1/-1;
}

label{
    color:#cbd5e1;
    font-size:13px;
}

input,
textarea{
    width:100%;
    border:1px solid rgba(255,255,255,.1);
    border-radius:13px;
    outline:none;
    background:#0a0f1d;
    color:#fff;
    padding:15px;
    font-size:14px;
    transition:.3s;
}

textarea{
    min-height:120px;
    resize:vertical;
}

input::placeholder,
textarea::placeholder{
    color:#64748b;
}

input:focus,
textarea:focus{
    border-color:#a855f7;
    box-shadow:0 0 0 4px rgba(168,85,247,.10);
}

/* SUMMARY */

.summary{
    position:sticky;
    top:105px;
}

.summary-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

.summary-top .card-title{
    margin:0;
}

.count{
    padding:6px 11px;
    border-radius:30px;
    background:rgba(168,85,247,.13);
    color:#d8b4fe;
    font-size:12px;
}

#orderSummary{
    display:flex;
    flex-direction:column;
}

.summary-item{
    display:flex;
    justify-content:space-between;
    gap:15px;
    padding:15px 0;
    border-bottom:1px solid rgba(255,255,255,.07);
    font-size:14px;
    color:#cbd5e1;
}

.summary-item strong{
    color:#fff;
    white-space:nowrap;
}

.empty{
    color:#64748b;
    text-align:center;
    padding:30px 0;
}

/* TOTAL */

.total{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:22px;
    padding-top:22px;
    border-top:1px solid rgba(255,255,255,.1);
}

.total span:first-child{
    color:#94a3b8;
}

#totalAmount{
    font-size:27px;
    font-weight:900;
    color:#c084fc;
}

/* BUTTON */

.place-order{
    width:100%;
    margin-top:25px;
    padding:17px;
    border:none;
    border-radius:14px;
    color:#fff;
    font-size:15px;
    font-weight:800;
    cursor:pointer;
    background:linear-gradient(135deg,#7c3aed,#a855f7,#06b6d4);
    background-size:200% 200%;
    box-shadow:0 15px 40px rgba(124,58,237,.25);
    transition:.35s;
}

.place-order:hover{
    transform:translateY(-3px);
    background-position:100% 50%;
    box-shadow:0 20px 50px rgba(168,85,247,.35);
}

.place-order:active{
    transform:scale(.98);
}

.place-order:disabled{
    opacity:.6;
    cursor:not-allowed;
    transform:none;
}

.security{
    text-align:center;
    color:#64748b;
    font-size:11px;
    margin-top:13px;
}

/* SUCCESS */

#successMessage{
    display:none;
    margin-top:20px;
    padding:17px;
    border-radius:14px;
    background:rgba(34,197,94,.08);
    border:1px solid rgba(34,197,94,.25);
    color:#86efac;
    line-height:1.6;
}

/* RESPONSIVE */

@media(max-width:850px){

    .checkout-grid{
        grid-template-columns:1fr;
    }

    .summary{
        position:static;
    }
}

@media(max-width:600px){

    header{
        padding:18px 5%;
    }

    main{
        padding:35px 5%;
    }

    .form-grid{
        grid-template-columns:1fr;
    }

    .field.full{
        grid-column:auto;
    }

    .card{
        padding:21px;
        border-radius:19px;
    }

    .secure{
        font-size:11px;
    }
}
</style>

</head>

<body>

<header>

```
<div class="nav">

    <div class="logo">
        Barira<span>Cart</span>
    </div>

    <div class="secure">
        🔒 Secure Checkout
    </div>

</div>
```

</header>

<main>

```
<div class="heading">

    <a href="index.html" class="back">
        ← Back to Cart
    </a>

    <h1>Complete your order.</h1>

    <p>
        Enter your information and get your order ready.
    </p>

</div>


<div class="checkout-grid">


    <!-- CUSTOMER INFORMATION -->

    <section class="card">

        <div class="card-title">
            📦 Delivery Information
        </div>


        <form id="checkoutForm">

            <div class="form-grid">


                <div class="field">

                    <label for="fullName">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="fullName"
                        name="fullName"
                        placeholder="Enter your full name"
                        required
                    >

                </div>


                <div class="field">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="you@example.com"
                        required
                    >

                </div>


                <div class="field">

                    <label for="phone">
                        Phone Number
                    </label>

                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                        placeholder="03XX XXXXXXX"
                        required
                    >

                </div>


                <div class="field">

                    <label for="city">
                        City
                    </label>

                    <input
                        type="text"
                        id="city"
                        name="city"
                        placeholder="Your city"
                        required
                    >

                </div>


                <div class="field full">

                    <label for="address">
                        Shipping Address
                    </label>

                    <textarea
                        id="address"
                        name="address"
                        placeholder="House number, street, area..."
                        required
                    ></textarea>

                </div>

            </div>


            <button
                type="submit"
                class="place-order"
                id="placeOrderBtn"
            >
                Place Order →
            </button>


            <div class="security">
                🔐 Your information is handled securely.
            </div>


            <div id="successMessage"></div>

        </form>

    </section>


    <!-- ORDER SUMMARY -->

    <aside class="card summary">

        <div class="summary-top">

            <div class="card-title">
                🛒 Your Order
            </div>

            <div class="count" id="cartCount">
                0 items
            </div>

        </div>


        <div id="orderSummary"></div>


        <div class="total">

            <span>
                Total
            </span>

            <strong id="totalAmount">
                Rs. 0
            </strong>

        </div>

    </aside>

</div>
```

</main>

<script>

/* =========================================
   BARIRACART CHECKOUT
   ========================================= */

const checkoutForm =
    document.getElementById("checkoutForm");

const orderSummary =
    document.getElementById("orderSummary");

const totalAmount =
    document.getElementById("totalAmount");

const cartCount =
    document.getElementById("cartCount");

const placeOrderBtn =
    document.getElementById("placeOrderBtn");

const successMessage =
    document.getElementById("successMessage");


/* GET CART */

let cart =
    JSON.parse(localStorage.getItem("bariraCart")) || [];

/* DISPLAY ORDER */

function displayOrderSummary(){

    orderSummary.innerHTML = "";

    if(cart.length === 0){

        orderSummary.innerHTML = `
            <div class="empty">
                Your cart is empty 🛒
            </div>
        `;

        totalAmount.textContent = "Rs. 0";
        cartCount.textContent = "0 items";

        return;
    }


    let total = 0;
    let quantity = 0;


    cart.forEach(item => {

        const price =
            Number(item.price) || 0;

        const itemQuantity =
            Number(item.quantity) || 1;

        const itemTotal =
            price * itemQuantity;


        total += itemTotal;

        quantity += itemQuantity;


        const row =
            document.createElement("div");

        row.className =
            "summary-item";


        row.innerHTML = `
            <span>
                ${item.name || "Product"}
                × ${itemQuantity}
            </span>

            <strong>
                Rs. ${itemTotal.toLocaleString()}
            </strong>
        `;


        orderSummary.appendChild(row);

    });


    totalAmount.textContent =
        `Rs. ${total.toLocaleString()}`;


    cartCount.textContent =
        `${quantity} ${quantity === 1 ? "item" : "items"}`;
}


/* INITIALIZE */

displayOrderSummary();


/* PLACE ORDER */

checkoutForm.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();


        if(cart.length === 0){

            alert(
                "Your cart is empty! 🛒"
            );

            return;
        }


        placeOrderBtn.disabled = true;

        placeOrderBtn.textContent =
            "Processing Order...";


 const orderData = {

    name:
        document.getElementById(
            "fullName"
        ).value.trim(),

    email:
        document.getElementById(
            "email"
        ).value.trim(),

    phone:
        document.getElementById(
            "phone"
        ).value.trim(),

    shipping_address:
        document.getElementById(
            "address"
        ).value.trim(),

    cart: cart
};


        try{

            const response =
                await fetch(
                    "/api/orders",
                    {
                        method:"POST",

                        headers:{
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify(orderData)
                    }
                );


            const data =
                await response.json();


            if(!response.ok){

                throw new Error(
                    data.message ||
                    "Unable to place order."
                );
            }


            /* SUCCESS */

            successMessage.style.display =
                "block";


            successMessage.innerHTML = `
                🎉 <strong>Order placed successfully!</strong><br>
                Order ID:
                <strong>#${data.orderId || data.id || ""}</strong>
            `;


           localStorage.removeItem("bariraCart");

            cart = [];

            displayOrderSummary();

            checkoutForm.reset();

            placeOrderBtn.textContent =
                "Order Placed ✓";


        }catch(error){

            console.error(error);

alert(
    "Order Error:\n\n" +
    error.message
);


            placeOrderBtn.disabled =
                false;


            placeOrderBtn.textContent =
                "Place Order →";
        }

    }
);

</script>

</body>
</html>
