<body>

<header class="header">
    <h1>🛍️ Product Management</h1>
    <p>Manage BariraCart products and inventory</p>
</header>

<main class="container">

    <div class="top-bar">

        <a
            class="back-btn"
            href="admin-dashboard.html"
        >
            ← Back to Dashboard
        </a>

        <button
            class="add-btn"
            onclick="addProduct()"
        >
            + Add Product
        </button>

    </div>

    <div class="table-container">

        <table>

            <thead>
                <tr>
                    <th>ID</th>
                    <th>Product</th>
                    <th>Category</th>
                    <th>Price</th>
                    <th>Stock</th>
                    <th>Actions</th>
                </tr>
            </thead>

            <tbody id="productsTable">

                <tr>
                    <td
                        colspan="6"
                        class="loading"
                    >
                        Loading products...
                    </td>
                </tr>

            </tbody>

        </table>

    </div>

</main>


<!-- =========================
     PRODUCT MODAL
========================= -->

<div
    id="productModal"
    class="modal"
>

    <div class="modal-box">

        <div class="modal-header">

            <h2 id="modalTitle">
                ➕ Add New Product
            </h2>

            <button
                type="button"
                class="close-btn"
                onclick="closeProductModal()"
            >
                ✕
            </button>

        </div>


        <form id="productForm">

            <div class="form-group">

                <label>
                    Product Name
                </label>

                <input
                    type="text"
                    id="productName"
                    placeholder="e.g. Smart Watch"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Description
                </label>

                <textarea
                    id="productDescription"
                    placeholder="Enter product description"
                    required
                ></textarea>

            </div>


            <div class="form-row">

                <div class="form-group">

                    <label>
                        Price (Rs.)
                    </label>

                    <input
                        type="number"
                        id="productPrice"
                        placeholder="2500"
                        min="0"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>
                        Stock
                    </label>

                    <input
                        type="number"
                        id="productStock"
                        placeholder="10"
                        min="0"
                        required
                    >

                </div>

            </div>


            <div class="form-group">

                <label>
                    Category
                </label>

                <input
                    type="text"
                    id="productCategory"
                    placeholder="e.g. Gadgets"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Image Filename
                </label>

                <input
                    type="text"
                    id="productImage"
                    placeholder="e.g. smartwatch.jpg"
                    required
                >

                <small>
                    Put the image file in the BariraCart project folder.
                </small>

            </div>


            <button
                type="submit"
                class="save-product-btn"
                id="saveProductBtn"
            >
                💾 Save Product
            </button>

        </form>

    </div>

</div>


<script>

/* ==========================================
   LOAD PRODUCTS
========================================== */

async function loadProducts() {

    const table =
        document.getElementById("productsTable");

    try {

        const response =
            await fetch("/api/products");

        const data =
            await response.json();

        if (
            !response.ok ||
            !data.success
        ) {
            throw new Error(
                data.message ||
                "Failed to load products."
            );
        }

        const products =
            data.products;

        if (
            !Array.isArray(products) ||
            products.length === 0
        ) {

            table.innerHTML = `
                <tr>
                    <td
                        colspan="6"
                        class="loading"
                    >
                        No products found.
                    </td>
                </tr>
            `;

            return;
        }


        table.innerHTML =
            products.map(product => {

                let stockClass = "";

                if (
                    Number(product.stock) === 0
                ) {

                    stockClass =
                        "out-stock";

                } else if (
                    Number(product.stock) <= 5
                ) {

                    stockClass =
                        "low-stock";
                }


                return `
                    <tr>

                        <td>
                            #${product.id}
                        </td>

                        <td>
                            <strong>
                                ${escapeHtml(product.name)}
                            </strong>
                        </td>

                        <td>
                            ${escapeHtml(
                                product.category || "-"
                            )}
                        </td>

                        <td>
                            Rs.
                            ${Number(
                                product.price
                            ).toLocaleString()}
                        </td>

                        <td
                            class="stock ${stockClass}"
                        >
                            ${product.stock}
                        </td>

                        <td>

                            <div class="actions">

                                <button
                                    class="action-btn edit-btn"
                                    onclick="editProduct(${product.id})"
                                >
                                    ✏️ Edit
                                </button>

                                <button
                                    class="action-btn delete-btn"
                                    onclick="deleteProduct(${product.id})"
                                >
                                    🗑️ Delete
                                </button>

                            </div>

                        </td>

                    </tr>
                `;

            }).join("");

    }

    catch (error) {

        console.error(
            "Products loading error:",
            error
        );

        table.innerHTML = `
            <tr>
                <td
                    colspan="6"
                    class="error"
                >
                    Failed to load products.
                </td>
            </tr>
        `;
    }
}


/* ==========================================
   ESCAPE HTML
========================================== */

function escapeHtml(value) {

    const div =
        document.createElement("div");

    div.textContent =
        value ?? "";

    return div.innerHTML;
}


/* ==========================================
   ADD PRODUCT MODAL
========================================== */

function addProduct() {

    document.getElementById(
        "modalTitle"
    ).textContent =
        "➕ Add New Product";

    document.getElementById(
        "saveProductBtn"
    ).textContent =
        "💾 Save Product";

    document.getElementById(
        "productForm"
    ).reset();

    document.getElementById(
        "productModal"
    ).style.display =
        "flex";
}


/* ==========================================
   CLOSE MODAL
========================================== */

function closeProductModal() {

    document.getElementById(
        "productModal"
    ).style.display =
        "none";
}


/* ==========================================
   EDIT PRODUCT
========================================== */

async function editProduct(id) {

    try {

        const response =
            await fetch(
                `/api/admin/products/${id}`,
                {
                    credentials: "include"
                }
            );

        const data =
            await response.json();

        if (
            !response.ok ||
            !data.success
        ) {

            alert(
                data.message ||
                "Failed to load product."
            );

            return;
        }


        const product =
            data.product;


        document.getElementById(
            "modalTitle"
        ).textContent =
            `✏️ Edit Product #${id}`;


        document.getElementById(
            "saveProductBtn"
        ).textContent =
            "💾 Update Product";


        document.getElementById(
            "productName"
        ).value =
            product.name || "";


        document.getElementById(
            "productDescription"
        ).value =
            product.description || "";


        document.getElementById(
            "productPrice"
        ).value =
            product.price || "";


        document.getElementById(
            "productStock"
        ).value =
            product.stock ?? "";


        document.getElementById(
            "productCategory"
        ).value =
            product.category || "";


        document.getElementById(
            "productImage"
        ).value =
            product.image || "";


        document.getElementById(
            "productModal"
        ).style.display =
            "flex";


    }

    catch (error) {

        console.error(
            "Edit product error:",
            error
        );

        alert(
            "Failed to load product."
        );
    }
}


/* ==========================================
   DELETE PRODUCT
========================================== */

async function deleteProduct(id) {

    const confirmDelete = confirm(
        "Are you sure you want to delete Product #" + id + "?"
    );

    if (!confirmDelete) {
        return;
    }

    try {

        const response = await fetch(
            `/api/admin/products/${id}`,
            {
                method: "DELETE",
                credentials: "include"
            }
        );

        const data = await response.json();

        if (!response.ok) {

            alert(
                "❌ " +
                (data.message || "Failed to delete product.")
            );

            return;
        }

        alert("✅ Product deleted successfully!");

        // Reload product table
        loadProducts();

    } catch (error) {

        console.error(
            "DELETE PRODUCT ERROR:",
            error
        );

        alert(
            "❌ Something went wrong while deleting the product."
        );
    }
}

/* ==========================================
   FORM SUBMISSION
========================================== */

document.getElementById(
    "productForm"
).addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        const product = {

            name:
                document.getElementById(
                    "productName"
                ).value.trim(),

            description:
                document.getElementById(
                    "productDescription"
                ).value.trim(),

            price:
                document.getElementById(
                    "productPrice"
                ).value,

            stock:
                document.getElementById(
                    "productStock"
                ).value,

            category:
                document.getElementById(
                    "productCategory"
                ).value.trim(),

            image:
                document.getElementById(
                    "productImage"
                ).value.trim()
        };


        try {

            const response =
                await fetch(
                    "/api/admin/products",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        credentials: "include",

                        body:
                            JSON.stringify(product)
                    }
                );


            const data =
                await response.json();


            if (
                !response.ok ||
                !data.success
            ) {

                throw new Error(
                    data.message ||
                    "Failed to add product."
                );
            }


            alert(
                "🎉 Product added successfully!"
            );


            document.getElementById(
                "productForm"
            ).reset();


            closeProductModal();


            loadProducts();

        }

        catch (error) {

            console.error(
                "Add product error:",
                error
            );

            alert(
                error.message ||
                "Server error while adding product."
            );
        }

    }
);


/* ==========================================
   START
========================================== */

loadProducts();

</script>

</body>
</html>
```
